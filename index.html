<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthServe Connect — Web MVP Prototype</title>
<style>
  :root{
    --teal:#0E5C55; --teal-dark:#0A4440; --teal-tint:#E3EFEC;
    --cream:#FBF7F1; --card:#FFFFFF; --ink:#1C2520; --muted:#6E7873;
    --line:#E7E1D6; --accent:#F2A541; --accent-ink:#4A2E05;
    --good:#3F8F6B; --good-tint:#E7F2EB; --alert:#C85A41; --alert-tint:#FBEAE6;
    --font-head: -apple-system, "Segoe UI Semibold", "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#D9D2C4;font-family:var(--font-body);color:var(--ink);}
  h1,h2,h3{font-family:var(--font-head);margin:0;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  input::placeholder{color:#A6ADA8;}

  .page-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 16px 56px;}
  .page-title{font-family:var(--font-head);font-weight:800;font-size:20px;color:#2B332E;text-align:center;}
  .page-sub{font-size:13px;color:#6E7873;text-align:center;max-width:480px;line-height:1.5;margin-top:-6px;}

  .phone-shell{width:390px;height:844px;border-radius:30px;background:var(--cream);box-shadow:0 30px 60px -20px rgba(0,0,0,0.35), 0 0 0 10px #15181a;overflow:hidden;position:relative;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--cream);}
  .screen.active{display:flex;}

  .scroll{flex:1;overflow:auto;min-height:0;}
  .topbar{padding:20px 20px 4px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .backbtn{display:flex;width:36px;height:36px;border-radius:10px;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid var(--line);flex-shrink:0;}

  .bottomnav{height:72px;flex-shrink:0;background:#FFFFFF;border-top:1px solid var(--line);display:flex;align-items:center;}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;background:none;border:none;padding:0;}
  .navitem.active{color:var(--teal);font-weight:700;}

  .cta{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;font-family:var(--font-head);}
  .cta[disabled]{background:#E7E1D6;color:#9BA299;}
  .su-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .su-chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:#FFFFFF;font-size:14px;font-weight:600;color:#1C2520;}
  .su-chip.sel{border-color:var(--teal);background:var(--teal-tint);color:#0E5C55;}
  input.su-err{border-color:#C9503C !important;}
  .su-chips.su-err,.su-consent.su-err{outline:1.5px solid #C9503C;outline-offset:4px;border-radius:12px;}
  .cta-outline{width:100%;background:#FFFFFF;border:1.5px solid var(--teal);color:var(--teal);border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;}

  .chip{text-align:left;border-radius:14px;padding:14px;border:1.5px solid var(--line);background:#FFFFFF;}
  .chip.picked{border-color:var(--accent);background:#FEF6E8;}

  .nav-controls{display:flex;gap:10px;align-items:center;margin-top:4px;flex-wrap:wrap;justify-content:center;}
  .nav-controls button{background:#FFFFFF;border:1px solid #C9C2B4;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;color:#39433E;}
  .nav-controls button:hover{background:#F2EFE8;}

  @media (max-width:460px){
    .phone-shell{width:100vw;height:100vh;border-radius:0;box-shadow:none;}
    .page-wrap{padding:0;}
    .page-title,.page-sub,.nav-controls{display:none;}
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="page-title">HealthServe Connect — Web MVP Prototype (R1 LEARN)</div>
  <div class="page-sub">Click through the screens below. Works fully offline — open this file directly in any browser, no internet needed.</div>

  <div class="phone-shell">

    <!-- ===================== SCREEN 1: LANGUAGE SELECT ===================== -->
    <div class="screen active" id="screen-lang">
      <div style="background:var(--teal);padding:40px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;">
        <div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.3 8 2 4 6 4c2.4 0 4 1.4 6 4 2-2.6 3.6-4 6-4 4 0 5.7 4 4 7.7C19.5 16.4 12 21 12 21z"/></svg>
        </div>
        <h1 style="color:#FFFFFF;font-size:20px;letter-spacing:-0.2px;margin:0;">HealthServe Connect</h1>
        <div id="lang-tagline" style="color:#CFE6E1;font-size:13px;text-align:center;line-height:1.4;max-width:310px;"></div>
      </div>

      <div class="scroll" style="padding:20px 24px 8px;display:flex;flex-direction:column;gap:16px;min-height:0;">

          <div id="lang-choose-sub" style="font-size:13px;color:var(--muted);margin-top:2px;"></div>
        </div>

        <div id="lang-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;"></div>

        <div style="margin-top:4px;background:var(--teal-tint);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;">

      </div>

      <div style="padding:16px 24px 28px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;">

    <!-- ===================== SCREEN 2: SIGN UP ===================== -->
    <div class="screen" id="screen-signup">
      <div class="topbar">
        <button class="backbtn" onclick="go('screen-lang')" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C2520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <h1 id="signup-title" style="font-size:17px;"></h1>
      </div>

      <div class="scroll" style="padding:16px 24px 8px;display:flex;flex-direction:column;gap:18px;">
        <div style="background:linear-gradient(135deg,#FCEFD4,#FBE4BE);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;">
          <div style="width:44px;height:44px;border-radius:12px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B9791F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a2 2 0 002 2h2a2 2 0 110 4m0-16a2 2 0 100 4m14-4v16M3 10V6a2 2 0 012-2h14a2 2 0 012 2v4M3 10h18"/></svg>
          </div>
          <div>
            <div id="signup-voucher-title" style="font-family:var(--font-head);font-weight:700;font-size:15px;color:#5A3B0A;"></div>
            <div id="signup-voucher-sub" style="font-size:12.5px;color:#7A5A24;margin-top:2px;"></div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;">
          <div>
            <div id="signup-name-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <input type="text" id="signup-name-input" autocomplete="given-name" oninput="clearSignupErr(this)" style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#FFFFFF;"/>
          </div>
          <div>
            <div id="signup-mobile-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <input type="tel" id="signup-phone-input" placeholder="+65 8xxx xxxx" oninput="clearSignupErr(this)" style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#FFFFFF;"/>
          </div>
          <div>
            <div id="signup-fin-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <input type="text" id="signup-fin-input" maxlength="4" placeholder="e.g. 7421" oninput="clearSignupErr(this)" style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#FFFFFF;"/>
          </div>
          <div>
            <div id="signup-sector-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <div class="su-chips" id="signup-sector-chips"></div>
          </div>
          <div>
            <div id="signup-shift-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <div class="su-chips" id="signup-shift-chips"></div>
          </div>
          <div>
            <div id="signup-referral-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <input type="text" id="signup-referral-input" autocapitalize="characters" style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#FFFFFF;"/>
          </div>
          <label class="su-consent" id="signup-consent-row" style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:#1C2520;">
            <input type="checkbox" id="signup-consent-input" onchange="clearSignupErr(document.getElementById('signup-consent-row'))" style="width:20px;height:20px;margin-top:1px;flex-shrink:0;accent-color:var(--teal);"/>
            <span id="signup-consent-text"></span>
          </label>
        </div>

        <div style="background:var(--teal-tint);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E5C55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-4z"/></svg>
          <div id="signup-privacy-note" style="font-size:12.5px;color:#2B4B47;line-height:1.5;"></div>
        </div>

        <label id="signup-demo-row" style="display:flex;gap:10px;align-items:flex-start;border:1.5px dashed #C9B98F;background:#FBF6E8;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;color:#6B5A2E;">
          <input type="checkbox" id="signup-demo-skip" onchange="onDemoSkipToggle()" style="width:18px;height:18px;margin-top:1px;flex-shrink:0;accent-color:#B9791F;"/>
          <span><b>Demo version:</b> tick this box to skip validation of the fields above and go straight in.</span>
        </label>

<script>
  // Stopping speech reliably needs more than a bare cancel(): some mobile
  // browsers (iOS Safari in particular) can keep an utterance audibly
  // playing after cancel() alone if it's called mid-speech. Pausing first,
  // then cancelling, and repeating the cancel shortly after on a timer,
  // covers the engines that need the extra nudge without affecting the ones
  // that don't.
  // speechGeneration guards the deferred follow-up cancel below: if new
  // speech starts (a newer generation) before that timeout fires, the
  // follow-up backs off instead of killing the utterance that just started.
  var speechGeneration = 0;
  function stopSpeech(scheduleFollowup){
    speechGeneration++;
    var myGeneration = speechGeneration;
    if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
    try { window.speechSynthesis.pause(); } catch(e) {}
    window.speechSynthesis.cancel();
    if (scheduleFollowup === false) return;
    setTimeout(function(){
      if (speechGeneration !== myGeneration) return; // newer speech started since — leave it alone
      try { window.speechSynthesis.cancel(); } catch(e) {}
    }, 50);
  }

  function go(id){
    // Stop any module audio the instant the screen changes — otherwise the
    // voice keeps reading a lesson the visitor has already navigated away
    // from, which feels broken (and a bit unsettling in a wellbeing app).
    stopSpeech();
    if (typeof closeReminders === 'function') closeReminders();
    if (typeof playing !== 'undefined') playing = false;
    if (typeof setPlayIcon === 'function') setPlayIcon(false);

    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    var target = document.getElementById(id);
    target.classList.add('active');
    var scroller = target.querySelector('.scroll');
    if (scroller) scroller.scrollTop = 0;
  }

  var MODULE_ORDER = ['stress','sleep','homesick','money'];
  var continueLearningId = 'stress'; // the module shown in Home's "Continue learning" card

  // ===================== PERSISTED STATE =====================
  // So this stays useable beyond a single click-through: module progress,
  // check-in history and the sign-up form actually persist across visits
  // (stored in localStorage, scoped to this browser).
  var STATE_KEY = 'hsc_app_state';
  function dateKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function seedDemoCheckins(){
    // Default demo history (4 consecutive prior days) so a fresh install still
    // shows a believable streak — once the visitor actually checks in, their
    // real activity takes over from here.
    var map = {};
    for (var i = 4; i >= 1; i--){
      var d = new Date(); d.setDate(d.getDate() - i);
      map[dateKey(d)] = 'okay';
    }
    return map;
  }
  function daysAgoKey(n){ var d = new Date(); d.setDate(d.getDate() - n); return dateKey(d); }

  function loadState(){
    var def = {
      moduleStatus: { stress:'in-progress', sleep:'not-started', homesick:'not-started', money:'done' },
      moduleStep: { stress:1, sleep:0, homesick:0, money:5 },
      lastChapterIdx: { stress:0, sleep:0, homesick:0, money:3 },
      // Last time each module was actually opened — powers the reminder bell
      // (an in-progress module untouched for 2+ weeks). Demo default shows
      // Stress as started 20 days ago so the feature is visible out of the box.
      moduleLastOpenedAt: { stress: daysAgoKey(20), sleep: null, homesick: null, money: daysAgoKey(1) },
      checkins: seedDemoCheckins(),
      bookmarks: {}, // key `${moduleId}|${chapterIdx}` -> dateKey() when bookmarked, merged into the check-in journal
      // Referrals are demo-seeded to show both states the Refer & Earn screen
      // can be in: a completed referral that's already paid out, and one
      // still working through the 4 mandatory first chapters.
      referrals: [
        { chaptersDone: 4, status: 'completed', date: daysAgoKey(9) },
        { chaptersDone: 2, status: 'in-progress', date: daysAgoKey(3) }
      ],
      lastOpenedModule: 'stress',
      profile: { phone:'', finLast4:'7421', name:'', sector:'', shift:'', referredBy:'', consent:false },
      // Chapters the visitor has actually read through (key `${moduleId}|${chapterIdx}`
      // -> true). Powers the one-time mini feedback survey after chapter 3.
      chaptersCompleted: {},
      surveyPromptShown: false,
      surveyResponse: null
    };
    try {
      var raw = localStorage.getItem(STATE_KEY);
      if (raw){
        var saved = JSON.parse(raw);
        return {
          moduleStatus: Object.assign({}, def.moduleStatus, saved.moduleStatus),
          moduleStep: Object.assign({}, def.moduleStep, saved.moduleStep),
          lastChapterIdx: Object.assign({}, def.lastChapterIdx, saved.lastChapterIdx),
          moduleLastOpenedAt: Object.assign({}, def.moduleLastOpenedAt, saved.moduleLastOpenedAt),
          checkins: Object.assign({}, saved.checkins), // real history fully replaces the seed once it exists
          bookmarks: Object.assign({}, saved.bookmarks),
          referrals: Array.isArray(saved.referrals) ? saved.referrals : def.referrals,
          lastOpenedModule: saved.lastOpenedModule || def.lastOpenedModule,
          profile: Object.assign({}, def.profile, saved.profile),
          chaptersCompleted: Object.assign({}, saved.chaptersCompleted),
          surveyPromptShown: !!saved.surveyPromptShown,
          surveyResponse: saved.surveyResponse || null
        };
      }
    } catch(e) {}
    return def;
  }
  function saveState(){
    try { localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); } catch(e) {}
  }
  var STATE = loadState();
  // Let saved progress override the demo defaults baked into MODULES.
  MODULE_ORDER.forEach(function(id){
    MODULES[id].status = STATE.moduleStatus[id];
    MODULES[id].currentStep = STATE.moduleStep[id];
  });
  continueLearningId = STATE.lastOpenedModule;

  // ===================== BOOKMARKS =====================
  function bookmarkKey(moduleId, chapterIdx){ return moduleId + '|' + chapterIdx; }
  function isBookmarked(moduleId, chapterIdx){ return !!STATE.bookmarks[bookmarkKey(moduleId, chapterIdx)]; }
  function toggleBookmark(moduleId, chapterIdx){
    var key = bookmarkKey(moduleId, chapterIdx);
    if (STATE.bookmarks[key]) delete STATE.bookmarks[key];
    else STATE.bookmarks[key] = dateKey(new Date());
    saveState();
  }

  // ===================== MINI FEEDBACK SURVEY =====================
  // Fires once, the first time a visitor has read through 3 chapters in
  // total (across any modules) — early enough to catch real first-use
  // impressions while they're fresh, without interrupting module 1.
  var SURVEY_TRIGGER_CHAPTERS = 3;
  var surveyRating = 0;
  function markChapterCompleted(moduleId, chapterIdx){
    var key = bookmarkKey(moduleId, chapterIdx); // same "mod|idx" shape as bookmarks
    if (!STATE.chaptersCompleted[key]){
      STATE.chaptersCompleted[key] = true;
      saveState();
    }
  }
  function completedChapterCount(){
    return Object.keys(STATE.chaptersCompleted).length;
  }
  function maybeTriggerSurvey(){
    if (STATE.surveyPromptShown) return;
    if (completedChapterCount() < SURVEY_TRIGGER_CHAPTERS) return;
    STATE.surveyPromptShown = true; // mark immediately so it can only ever fire once, even if saveState() is slow
    saveState();
    openSurvey();
  }
  function openSurvey(){
    surveyRating = 0;
    renderSurveyModal();
    document.getElementById('survey-backdrop').style.display = 'block';
    document.getElementById('survey-panel').style.display = 'block';
  }
  function closeSurvey(){
    document.getElementById('survey-backdrop').style.display = 'none';
    document.getElementById('survey-panel').style.display = 'none';
  }
  function skipSurvey(){
    closeSurvey();
  }
  function pickSurveyRating(n){
    surveyRating = n;
    document.querySelectorAll('.survey-star').forEach(function(btn, i){
      var filled = (i + 1) <= n;
      var path = btn.querySelector('path');
      path.setAttribute('fill', filled ? '#0E5C55' : 'none');
      path.setAttribute('stroke', filled ? '#0E5C55' : '#39433E');
      btn.style.borderColor = filled ? 'var(--teal)' : 'var(--line)';
      btn.style.background = filled ? 'var(--teal-tint)' : '#FFFFFF';
    });
    document.getElementById('survey-submit-btn').disabled = false;
  }
  function submitSurvey(){
    if (!surveyRating) return;
    var feedback = document.getElementById('survey-feedback-input').value.trim();
    STATE.surveyResponse = { rating: surveyRating, feedback: feedback, date: dateKey(new Date()) };
    saveState();
    document.getElementById('survey-form').style.display = 'none';
    document.getElementById('survey-thanks').style.display = 'block';
    setTimeout(closeSurvey, 1600);
  }
  function renderSurveyModal(){
    setText('survey-title', t('surveyTitle'));
    setText('survey-subtitle', t('surveySubtitle'));
    setText('survey-feedback-label', t('surveyFeedbackLabel'));

    document.getElementById('survey-feedback-input').value = '';
    setText('survey-submit-btn', t('surveySubmit'));

    document.getElementById('survey-form').style.display = 'flex';
    document.getElementById('survey-thanks').style.display = 'none';
    document.querySelectorAll('.survey-star').forEach(function(btn){
      var path = btn.querySelector('path');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#39433E');
      btn.style.borderColor = 'var(--line)';
      btn.style.background = '#FFFFFF';
    });
  }

  // ===================== REMINDERS (bell icon) =====================
  // Flags a module the visitor started but hasn't come back to in 2 weeks —
  // the bell shows a dot, and tapping it lists those modules with a
  // one-tap way back in.
  var STALE_DAYS = 14;
  function daysSince(dateStr){
    if (!dateStr) return 0;
    var then = new Date(dateStr + 'T00:00:00');
    var now = new Date(dateKey(new Date()) + 'T00:00:00');
    return Math.round((now - then) / 86400000);
  }
  function staleModuleIds(){
    return MODULE_ORDER.filter(function(id){
      return MODULES[id].status === 'in-progress' && daysSince(STATE.moduleLastOpenedAt[id]) >= STALE_DAYS;
    });
  }
  function renderReminderBadge(){
    var dot = document.getElementById('reminder-dot');
    if (!dot) return;
    dot.style.display = staleModuleIds().length ? 'block' : 'none';
  }
  function closeReminders(){
    document.getElementById('reminders-backdrop').style.display = 'none';
    document.getElementById('reminders-panel').style.display = 'none';
  }
  function toggleReminders(){
    var panel = document.getElementById('reminders-panel');
    if (panel.style.display === 'block'){ closeReminders(); return; }
    renderRemindersList();
    document.getElementById('reminders-backdrop').style.display = 'block';
    panel.style.display = 'block';
  }
  function renderRemindersList(){
    document.getElementById('reminders-title').textContent = t('remindersTitle');
    var list = document.getElementById('reminders-list');
    var empty = document.getElementById('reminders-empty');
    list.innerHTML = '';
    var stale = staleModuleIds();
    if (!stale.length){
      empty.style.display = 'block';
      empty.textContent = t('remindersEmpty');
      return;
    }
    empty.style.display = 'none';
    stale.forEach(function(id){
      var m = MODULES[id];
      var row = document.createElement('button');
      row.onclick = function(){ closeReminders(); openChapter(id, STATE.lastChapterIdx[id] || 0); };
      row.style.cssText = 'display:flex;align-items:center;gap:10px;background:var(--teal-tint);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;';
      row.innerHTML =
        '<div style="width:32px;height:32px;border-radius:9px;background:'+m.iconBg+';display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="'+m.iconColorSmall+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+m.iconPath+'"/></svg>' +
        '</div>' +
        '<div style="flex:1;">' +
          '<div style="font-weight:600;font-size:13px;">'+moduleTitle(id, pickedLang)+'</div>' +
          '<div style="font-size:11.5px;color:var(--muted);margin-top:1px;">'+t('daysSinceOpened').replace('{n}', daysSince(STATE.moduleLastOpenedAt[id]))+'</div>' +
        '</div>';
      list.appendChild(row);
    });
  }

  // ===================== REFER & EARN =====================
  // "Mandatory courses" = chapter 1 of every module (the 4 chapters, one per
  // module, that already exist as the original vetted content) — a referral

          (done
            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F8F6B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
            : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E5C55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>') +

  function copyReferralCode(){

  function showReferralCopiedNote(){
    var note = document.getElementById('referral-copied-note');
    note.style.display = 'block';
    clearTimeout(window.__referralCopiedTimer);
    window.__referralCopiedTimer = setTimeout(function(){ note.style.display = 'none'; }, 2200);

  function copyToClipboard(text){
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text);
        return;
      }
    } catch(e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(e) {}
  }
  function shareReferral(){
    var message = t('shareMessage').replace('{code}', getReferralCode());
    if (navigator.share){
      navigator.share({ title: 'HealthServe Connect', text: message }).catch(function(){});
    } else {
      copyToClipboard(message);
      showReferralCopiedNote();
    }
  }

  function computeStreak(){
    var dates = Object.keys(STATE.checkins).sort();
    if (!dates.length) return 0;
    var streak = 1;
    for (var i = dates.length - 1; i > 0; i--){
      var diffDays = Math.round((new Date(dates[i]) - new Date(dates[i-1])) / 86400000);
      if (diffDays === 1) streak++; else break;
    }
    return streak;
  }
  function recordCheckin(mood){
    STATE.checkins[dateKey(new Date())] = mood;
    saveState();
    setText('profile-streak-value', computeStreak());
    setText('profile-checkins-value', Object.keys(STATE.checkins).length);
  }

  // ===================== CHECK-IN JOURNAL =====================

  function renderCheckinJournal(){
    var today = dateKey(new Date());
    var todaysMood = STATE.checkins[today];
    var good = document.getElementById('mood-good');
    var escalate = document.getElementById('mood-escalate');

    if (todaysMood){
      document.getElementById('checkin-today-picker').style.display = 'none';
      document.getElementById('mood-row').style.display = 'none';
      document.getElementById('checkin-today-logged').style.display = 'flex';
      document.getElementById('checkin-today-emoji').textContent = MOOD_EMOJI[todaysMood];
      document.getElementById('checkin-today-label-text').textContent = t(MOOD_LABEL_KEY[todaysMood]);
      document.getElementById('checkin-today-date-text').textContent = t('todayLabel');
      document.getElementById('checkin-change-btn').textContent = t('changeEntry');
      if (todaysMood === 'great' || todaysMood === 'okay'){
        good.style.display = 'block';
        escalate.style.display = 'none';
      } else {
        good.style.display = 'none';
        escalate.style.display = 'flex';
      }
    } else {
      document.getElementById('checkin-today-picker').style.display = 'block';
      document.getElementById('mood-row').style.display = 'flex';
      document.getElementById('checkin-today-logged').style.display = 'none';
      good.style.display = 'none';
      escalate.style.display = 'none';
    }

    // History — mood check-ins and bookmarked chapters, merged into one
    // timeline, most recent first (per the user's choice to keep bookmarks
    // inside this journal rather than a separate notebook screen).
    var historyList = document.getElementById('checkin-history-list');
    var emptyNote = document.getElementById('checkin-history-empty');
    if (!historyList) return; // guard in case this runs before the screen exists
    historyList.innerHTML = '';

    var entries = [];
    Object.keys(STATE.checkins).forEach(function(d){
      if (d === today) return;
      entries.push({ date: d, type: 'mood', mood: STATE.checkins[d] });
    });
    Object.keys(STATE.bookmarks).forEach(function(key){
      var parts = key.split('|');
      var moduleId = parts[0], chapterIdx = parseInt(parts[1], 10);
      if (!MODULES[moduleId] || !MODULES[moduleId].chapters[chapterIdx]) return;
      entries.push({ date: STATE.bookmarks[key], type: 'bookmark', moduleId: moduleId, chapterIdx: chapterIdx });
    });
    entries.sort(function(a, b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });

    if (!entries.length){
      emptyNote.style.display = 'block';
      emptyNote.textContent = t('noCheckinsYet');
    } else {
      emptyNote.style.display = 'none';
      entries.forEach(function(entry){
        var row = document.createElement('div');
        var dateObj = new Date(entry.date + 'T00:00:00');
        var emojiEl = document.createElement('div');
        emojiEl.style.fontSize = '22px';
        var textWrap = document.createElement('div');
        textWrap.style.flex = '1';
        var labelEl = document.createElement('div');
        labelEl.style.cssText = 'font-weight:600;font-size:13.5px;';
        var dateEl = document.createElement('div');
        dateEl.style.cssText = 'font-size:11.5px;color:var(--muted);margin-top:1px;';
        dateEl.textContent = formatHistoryDate(dateObj);
        textWrap.appendChild(labelEl);
        textWrap.appendChild(dateEl);

        if (entry.type === 'mood'){
          row.style.cssText = 'display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;';
          emojiEl.textContent = MOOD_EMOJI[entry.mood] || '';
          labelEl.textContent = t(MOOD_LABEL_KEY[entry.mood]) || entry.mood;
          row.appendChild(emojiEl);
          row.appendChild(textWrap);
        } else {
          var chapter = MODULES[entry.moduleId].chapters[entry.chapterIdx];
          row.style.cssText = 'display:flex;align-items:center;gap:12px;background:var(--teal-tint);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;';
          row.onclick = function(){ openChapter(entry.moduleId, entry.chapterIdx); };
          emojiEl.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#0E5C55" stroke="#0E5C55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>';
          emojiEl.style.fontSize = '';
          labelEl.textContent = t('bookmarkedTag') + ' · ' + (chapter.shortTitle[pickedLang] || chapter.shortTitle.en);
          dateEl.textContent = formatHistoryDate(dateObj) + ' · ' + moduleTitle(entry.moduleId, pickedLang);
          row.appendChild(emojiEl);
          row.appendChild(textWrap);
        }
        historyList.appendChild(row);
      });
    }
  }

  // Sign-up completion: validates the required fields, then remembers it so a
  // returning user skips language + sign-up entirely next time and lands
  // straight on Home. Also actually saves what they typed, instead of discarding it.
  // Demo-only escape hatch: lets a presenter or reviewer tap through sign-up
  // without filling anything in.
  function onDemoSkipToggle(){
    if (document.getElementById('signup-demo-skip').checked){
      document.querySelectorAll('#screen-signup .su-err').forEach(function(el){ el.classList.remove('su-err'); });
      document.getElementById('signup-error-note').style.display = 'none';
    }
  }
  function finishSignup(){
    var skipValidation = document.getElementById('signup-demo-skip').checked;
    var nameEl = document.getElementById('signup-name-input');
    var phoneEl = document.getElementById('signup-phone-input');
    var finEl = document.getElementById('signup-fin-input');
    var refEl = document.getElementById('signup-referral-input');
    var consentEl = document.getElementById('signup-consent-input');

    var name = nameEl.value.trim();
    var phone = phoneEl.value.trim();
    var fin = finEl.value.trim();
    var bad = [];
    function flag(el, isBad){
      if (isBad){ el.classList.add('su-err'); bad.push(el); } else { el.classList.remove('su-err'); }
    }
    flag(nameEl, !name);
    flag(phoneEl, phone.replace(/\D/g, '').length < 8);
    flag(finEl, fin.length < 4);
    flag(document.getElementById('signup-sector-chips'), !signupSector);
    flag(document.getElementById('signup-shift-chips'), !signupShift);
    flag(document.getElementById('signup-consent-row'), !consentEl.checked);

    var note = document.getElementById('signup-error-note');
    if (skipValidation){
      bad = [];
      document.querySelectorAll('#screen-signup .su-err').forEach(function(el){ el.classList.remove('su-err'); });
    }
    if (bad.length){
      note.textContent = t('signupError');
      note.style.display = 'block';
      bad[0].scrollIntoView({ block:'center', behavior:'smooth' });
      return;
    }
    note.style.display = 'none';

    try { localStorage.setItem('hsc_onboarded', 'true'); } catch(e) {}
    // With validation skipped, only overwrite the demo defaults with what was actually typed.
    if (name || !skipValidation) STATE.profile.name = name;
    if (phone || !skipValidation) STATE.profile.phone = phone;
    if (fin || !skipValidation) STATE.profile.finLast4 = fin.slice(-4);
    STATE.profile.sector = signupSector;
    STATE.profile.shift = signupShift;
    STATE.profile.referredBy = refEl.value.trim().toUpperCase();
    STATE.profile.consent = consentEl.checked;
    saveState();
    applyLanguage(); // refresh the greeting and Profile with the real values
    go('screen-home');
  }

          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E5C55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 17h.01M12 14a2 2 0 10-2-2"/></svg>') +
      '</div>' +
      '<div style="flex:1;font-weight:700;font-size:14px;">'+t('takeTheQuiz')+'</div>';
    list.appendChild(quizRow);
  }

  function backToChapters(){
    renderChapterList(currentModuleId); // bookmark state may have changed on the chapter screen
    go('screen-chapters');
  }

  function openChapter(id, chapterIdx){
    currentModuleId = id;
    currentChapterIdx = chapterIdx;
    resetQuizState();
    stopSpeech();
    playing = false;
    setPlayIcon(false);

    // Opening a chapter is itself progress — persist it so "Continue learning"
    // on Home reflects what the visitor actually did last, across visits.
    if (MODULES[id].status === 'not-started'){
      MODULES[id].status = 'in-progress';
    }
    MODULES[id].currentStep = Math.max(MODULES[id].currentStep, chapterIdx + 1);
    STATE.moduleStatus[id] = MODULES[id].status;
    STATE.moduleStep[id] = MODULES[id].currentStep;
    STATE.lastChapterIdx[id] = chapterIdx;
    STATE.moduleLastOpenedAt[id] = dateKey(new Date());
    if (MODULES[id].status !== 'done'){
      continueLearningId = id;
      STATE.lastOpenedModule = id;
    }
    // Jumping straight to a later chapter (chapter list, dots, reminders,
    // "continue learning") means everything before it was necessarily
    // already passed — count those as completed too, not just chapters
    // reached by clicking "Next chapter" in order.
    for (var i = 0; i < chapterIdx; i++){
      markChapterCompleted(id, i);
    }
    saveState();
    renderReminderBadge();

    renderModuleScreen();
    go('screen-module');
    maybeTriggerSurvey();
  }

  function nextChapterOrQuiz(){
    var m = MODULES[currentModuleId];
    if (currentChapterIdx < m.chapters.length - 1){
      markChapterCompleted(currentModuleId, currentChapterIdx); // the chapter being left behind is, by definition, read
      openChapter(currentModuleId, currentChapterIdx + 1);
    } else {
      // The last chapter of a module isn't "completed" just by opening its
      // quiz — only once the quiz itself is actually passed (see pickQuiz()).
      renderQuiz(true);
      go('screen-quiz');
    }
    maybeTriggerSurvey();
  }

  function prevChapter(){
    if (currentChapterIdx > 0){
      openChapter(currentModuleId, currentChapterIdx - 1);
    }
  }

  function toggleCurrentBookmark(){
    toggleBookmark(currentModuleId, currentChapterIdx);
    updateModuleBookmarkIcon();
  }

  function updateModuleBookmarkIcon(){
    var icon = document.getElementById('module-bookmark-icon');
    if (!icon) return;
    icon.setAttribute('fill', isBookmarked(currentModuleId, currentChapterIdx) ? '#0E5C55' : 'none');
  }

  function renderModuleScreen(){
    var m = MODULES[currentModuleId];
    var totalChapters = m.chapters.length;
    document.getElementById('module-eyebrow').textContent = moduleTitle(currentModuleId, pickedLang);
    document.getElementById('module-title').textContent = chapterShortTitle(currentModuleId, currentChapterIdx, pickedLang);

    var dots = document.getElementById('module-dots');
    dots.innerHTML = '';
    for (var i = 0; i < totalChapters; i++){
      var dot = document.createElement('button');
      dot.setAttribute('aria-label', t('chapterOf').replace('{n}', i + 1).replace('{total}', totalChapters));
      dot.style.cssText = 'flex:1;height:6px;border-radius:4px;border:none;padding:0;cursor:pointer;background:' + (i <= currentChapterIdx ? '#0E5C55' : '#E7E1D6') + ';';
      (function(idx){ dot.onclick = function(){ if (idx !== currentChapterIdx) openChapter(currentModuleId, idx); }; })(i);
      dots.appendChild(dot);
    }
    document.getElementById('module-step-label').textContent = t('chapterOf').replace('{n}', currentChapterIdx + 1).replace('{total}', totalChapters);

    document.getElementById('module-icon-box').innerHTML = '<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="'+m.iconColorBig+'" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"><path d="'+m.iconPath+'"/></svg>';

    var body = chapterBody(currentModuleId, currentChapterIdx, pickedLang);
    document.getElementById('module-headline').textContent = body.headline;
    document.getElementById('module-body').textContent = body.text;

    document.getElementById('module-listen-label').textContent = t('listenInstead');
    var langEntry = LANGS.filter(function(l){ return l.id === pickedLang; })[0] || LANGS[1];
    document.getElementById('module-lang-tag').textContent = langEntry.native;

    document.getElementById('module-next-btn').textContent = currentChapterIdx < totalChapters - 1 ? t('nextChapter') : t('takeTheQuiz');
    document.getElementById('module-skip-btn').textContent = t('viewAllChapters');

    var prevBtn = document.getElementById('module-prev-btn');
    // display:none (not visibility:hidden) on chapter 1, so its reserved
    // width+gap doesn't shift the Next button off-center / out of alignment
    // with the audio card and "View all chapters" link above and below it.
    prevBtn.style.display = currentChapterIdx === 0 ? 'none' : 'flex';
    prevBtn.setAttribute('aria-label', t('previousChapter'));

    // Decide up front whether this device actually has a voice for the
    // selected language, so we never show a play button that can't work —
    // no false "listening" promise, no reactive error message after the fact.
    setAudioRowAvailability(hasVoiceForLang(SPEECH_LANG[pickedLang] || 'en-US'), langEntry);

    updateModuleBookmarkIcon();
  }

  // Audio player toggle (visual only)
  var playing = false;
  var SPEECH_LANG = { en:'en-US', ta:'ta-IN', bn:'bn-IN', zh:'zh-CN', th:'th-TH', my:'my-MM' };

  // Pick a calmer, more natural-sounding voice where one is available —
  // some browsers fall back to a harsh, robotic default system voice
  // (particularly for English) which isn't right for a wellbeing app.
  var cachedVoices = [];
  function refreshVoiceCache(){
    if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
  }
  if ('speechSynthesis' in window){
    refreshVoiceCache();
    window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
  }
  function pickVoice(langTag){
    if (!cachedVoices.length) refreshVoiceCache();
    var voices = cachedVoices;
    if (!voices || !voices.length) return null;
    var langPrefix = langTag.split('-')[0];
    var pool = voices.filter(function(v){ return v.lang === langTag; });
    if (!pool.length) pool = voices.filter(function(v){ return v.lang && v.lang.indexOf(langPrefix) === 0; });
    if (!pool.length) return null;
    return bestVoiceFrom(pool, voices);
  }
  function hasVoiceForLang(langTag){
    if (!cachedVoices.length) refreshVoiceCache();
    var voices = cachedVoices;
    if (!voices || !voices.length) return false;
    var langPrefix = langTag.split('-')[0];
    return voices.some(function(v){ return v.lang === langTag || (v.lang && v.lang.indexOf(langPrefix) === 0); });
  }
  function bestVoiceFrom(pool, voices){
    // Avoid known harsh/novelty system voices; prefer natural-sounding ones.
    var harsh = /whisper|bells|albert|bad news|bahh|boing|bubbles|cellos|deranged|hysterical|pipe organ|trinoids|zarvox|wobble|jester|organ|rocko|eddy|flo|grandpa|grandma|reed|sandy|shelley|junior/i;
    var calm = voices.filter(function(v){ return pool.indexOf(v) !== -1 && !harsh.test(v.name); });
    var candidates = calm.length ? calm : pool;
    candidates = candidates.slice().sort(function(a, b){
      function score(v){
        var s = 0;
        if (/google|natural|online|neural|microsoft.*online/i.test(v.name)) s += 3;
        if (/female/i.test(v.name)) s += 1; // tends to read calmer by default for this content
        if (v.localService === false) s += 1; // cloud voices are usually higher quality
        return s;
      }
      return score(b) - score(a);
    });
    return candidates[0];
  }

  function setPlayIcon(isPlaying){
    var icon = document.getElementById('playicon');
    if (!icon) return;
    icon.innerHTML = isPlaying
      ? '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>'
      : '<path d="M8 5v14l11-7z"></path>';
  }
  // Switches the audio row between "play button" and "narration coming
  // soon" states. Driven proactively by renderModuleScreen() (based on
  // whether the device actually has a voice for the chosen language), and
  // also used reactively if a genuine speech error fires mid-playback.
  function setAudioRowAvailability(available, langEntry){
    var availableRow = document.getElementById('module-audio-available-row');
    var comingSoonRow = document.getElementById('module-audio-comingsoon-row');
    if (!availableRow || !comingSoonRow) return;
    availableRow.style.display = available ? 'flex' : 'none';
    comingSoonRow.style.display = available ? 'none' : 'flex';
    if (!available){
      document.getElementById('module-comingsoon-label').textContent = t('audioUnavailable');
      document.getElementById('module-lang-tag-2').textContent = langEntry ? langEntry.native : '';
    }
  }
  function togglePlay(){
    if (!('speechSynthesis' in window) || playing === false && !hasVoiceForLang(SPEECH_LANG[pickedLang] || 'en-US')){
      // No speech support at all, or no voice for this language — the play
      // button shouldn't even be visible in that case (see
      // renderModuleScreen), but guard here too in case state is stale.
      var langEntry = LANGS.filter(function(l){ return l.id === pickedLang; })[0] || LANGS[1];
      setAudioRowAvailability(false, langEntry);
      return;
    }
    if (playing){
      stopSpeech();
      playing = false;
      setPlayIcon(false);
      return;
    }
    var langTag = SPEECH_LANG[pickedLang] || 'en-US';
    var content = chapterBody(currentModuleId, currentChapterIdx, pickedLang);
    var text = content.headline + '. ' + content.text;
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = langTag;
    var voice = pickVoice(langTag);
    if (voice) utter.voice = voice;
    utter.rate = 0.95;
    utter.pitch = 1;
    utter.onend = function(){ playing = false; setPlayIcon(false); };
    utter.onerror = function(e){
      // A genuine synthesis failure (not just "paused by the user"):
      // "canceled"/"interrupted" fire whenever we stop our own speech
      // (including the stopSpeech(false) call a few lines below, right
      // before every fresh play) — that's normal and not a real error.
      if (e && (e.error === 'canceled' || e.error === 'interrupted')) return;
      playing = false;
      setPlayIcon(false);
      var le = LANGS.filter(function(l){ return l.id === pickedLang; })[0] || LANGS[1];
      setAudioRowAvailability(false, le);
    };
    stopSpeech(false); // stop anything already speaking first, no deferred re-cancel
    speechGeneration++; // invalidate any still-pending re-cancel from an earlier stopSpeech() call
    window.speechSynthesis.speak(utter);
    playing = true;
    setPlayIcon(true);
  }

  // ===================== QUIZ =====================
  var quizSolved = false;

  function resetQuizState(){
    quizSolved = false;
  }

  // Leaving the quiz after finishing — refresh Home so the module's "done"
  // status and updated progress show up immediately, not just after a
  // language switch forces a re-render.
  function finishModule(){
    renderHomeModules();
    renderContinueCard();
    renderReminderBadge();
    go('screen-home');
  }

  function renderQuiz(fresh){
    // fresh=true means "the visitor is newly arriving at this quiz" (vs. a
    // language-switch re-render of a quiz already in progress) — only then
    // do we clear any previously-solved state, so jumping straight to a
    // different module's quiz can't inherit an earlier quiz's "already
    // answered" status and silently ignore every option tap.
    if (fresh) resetQuizState();
    var q = moduleQuiz(currentModuleId, pickedLang);
    document.getElementById('quiz-topbar-title').textContent = t('quickCheck');
    document.getElementById('quiz-eyebrow').textContent = moduleTitle(currentModuleId, pickedLang);
    document.getElementById('quiz-question').textContent = q.question;

    var opts = document.getElementById('quiz-options');
    opts.innerHTML = '';
    q.options.forEach(function(optText, idx){
      var btn = document.createElement('button');
      btn.className = 'chip';
      btn.onclick = function(){ pickQuiz(btn, idx === q.correct); };
      btn.innerHTML = '<div style="display:flex;align-items:center;gap:12px;">' +
        '<div class="ring" style="width:22px;height:22px;border-radius:50%;border:2px solid #CBD3CE;flex-shrink:0;"></div>' +
        '<div style="font-size:14.5px;font-weight:500;flex:1;">'+optText+'</div>' +
      '</div>';
      opts.appendChild(btn);
    });

    document.getElementById('quiz-feedback').style.display = 'none';
    document.getElementById('quiz-finish').disabled = !quizSolved;
    document.getElementById('quiz-finish').textContent = quizSolved ? t('finishModule') : t('chooseAnswer');
  }

  function pickQuiz(el, correct){
    if (quizSolved) return; // lock in the right answer once found, so the state stays unambiguous

    document.querySelectorAll('#quiz-options .chip').forEach(function(c){
      c.classList.remove('picked');
      c.style.borderColor = '#E7E1D6';
      c.style.background = '#FFFFFF';
      var ring = c.querySelector('.ring');
      ring.style.border = '2px solid #CBD3CE';
      ring.style.background = 'transparent';
      ring.innerHTML = '';
    });

    el.classList.add('picked');
    var ring = el.querySelector('.ring');
    ring.style.display = 'flex';
    ring.style.alignItems = 'center';
    ring.style.justifyContent = 'center';

    var feedback = document.getElementById('quiz-feedback');
    var icon = document.getElementById('quiz-feedback-icon');
    var text = document.getElementById('quiz-feedback-text');
    var finishBtn = document.getElementById('quiz-finish');
    feedback.style.display = 'flex';

    var q = moduleQuiz(currentModuleId, pickedLang);

    if (correct) {
      quizSolved = true;
      el.style.borderColor = '#3F8F6B';
      el.style.background = '#F3FBF6';
      ring.style.border = '2px solid #3F8F6B';
      ring.style.background = '#3F8F6B';
      ring.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

      feedback.style.background = 'var(--good-tint)';
      icon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F8F6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>';
      text.style.color = '#255440';
      text.textContent = q.correctFeedback;

      finishBtn.disabled = false;
      finishBtn.textContent = t('finishModule');

      // Persist completion — Profile's "Modules done" count and Home's status
      // badges now reflect real progress, not a fixed demo number.
      MODULES[currentModuleId].status = 'done';
      MODULES[currentModuleId].currentStep = MODULES[currentModuleId].steps;
      STATE.moduleStatus[currentModuleId] = 'done';
      STATE.moduleStep[currentModuleId] = MODULES[currentModuleId].steps;
      // The module's last chapter only counts as "completed" now that its
      // quiz is actually passed — not back when the quiz screen was opened.
      markChapterCompleted(currentModuleId, MODULES[currentModuleId].chapters.length - 1);
      saveState();
      maybeTriggerSurvey();
    } else {
      el.style.borderColor = '#C85A41';
      el.style.background = '#FBEAE6';
      ring.style.border = '2px solid #C85A41';
      ring.style.background = '#C85A41';
      ring.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

      feedback.style.background = 'var(--alert-tint)';
      icon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C85A41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
      text.style.color = '#7A2E1E';
      text.textContent = q.wrongFeedback;

      finishBtn.disabled = true;
      finishBtn.textContent = t('chooseAnswer');
    }
  }

  // ===================== CHECK-IN =====================
  function pickMood(el){
    var mood = el.getAttribute('data-mood');
    recordCheckin(mood);
    renderCheckinJournal();
  }

  // Home dashboard inline check-in — one tap, no page change
  function pickHomeMood(el){
    document.querySelectorAll('.home-mood-btn').forEach(function(b){
      b.style.background = 'rgba(255,255,255,0.14)';
      b.style.borderColor = 'transparent';
    });
    el.style.background = 'rgba(255,255,255,0.32)';
    el.style.borderColor = 'rgba(255,255,255,0.6)';

    var mood = el.getAttribute('data-mood');
    var good = document.getElementById('home-mood-good');
    var escalate = document.getElementById('home-mood-escalate');
    if (mood === 'great' || mood === 'okay'){
      good.style.display = 'block';
      escalate.style.display = 'none';
    } else {
      good.style.display = 'none';
      escalate.style.display = 'flex';
    }
    recordCheckin(mood);
  }

  // ===================== INITIALISE =====================
  renderLangs();
  applyLanguage();

  // Every visitor starts at language selection, then sign-up — there is no
  // real login yet, so there is no verified identity to safely skip ahead
  // for. Once a real login exists, this is where it should route a
  // recognised user back to their last screen instead.
  go('screen-lang');
</script>

</body>
</html>
