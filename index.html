<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthServe Connect — Web MVP Prototype</title>
<style>
  :root{
    --teal:#0E5C55; --teal-dark:#0A4440; --teal-tint:#E3EFEC;
    --cream:#FBF7F1; --card:#FFFFFF; --ink:#1C2520; --muted:#6E7873;
    --line:#E7E1D6; --accent:#F2A541; --accent-ink:#4A2E05;
    --good:#3F8F6B; --good-tint:#E7F2EB; --alert:#C85A41; --alert-tint:#FBEAE6;
    --font-head: -apple-system, "Segoe UI Semibold", "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#D9D2C4;font-family:var(--font-body);color:var(--ink);}
  h1,h2,h3{font-family:var(--font-head);margin:0;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  input::placeholder{color:#A6ADA8;}

  .page-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 16px 56px;}
  .page-title{font-family:var(--font-head);font-weight:800;font-size:20px;color:#2B332E;text-align:center;}
  .page-sub{font-size:13px;color:#6E7873;text-align:center;max-width:480px;line-height:1.5;margin-top:-6px;}

  .phone-shell{width:390px;height:844px;border-radius:30px;background:var(--cream);box-shadow:0 30px 60px -20px rgba(0,0,0,0.35), 0 0 0 10px #15181a;overflow:hidden;position:relative;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--cream);}
  .screen.active{display:flex;}

  .scroll{flex:1;overflow:auto;}
  .topbar{padding:20px 20px 4px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .backbtn{display:flex;width:36px;height:36px;border-radius:10px;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid var(--line);flex-shrink:0;}

  .bottomnav{height:72px;flex-shrink:0;background:#FFFFFF;border-top:1px solid var(--line);display:flex;align-items:center;}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;background:none;border:none;padding:0;}
  .navitem.active{color:var(--teal);font-weight:700;}

  .cta{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;font-family:var(--font-head);}
  .cta[disabled]{background:#E7E1D6;color:#9BA299;}
  .cta-outline{width:100%;background:#FFFFFF;border:1.5px solid var(--teal);color:var(--teal);border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;}

  .chip{text-align:left;border-radius:14px;padding:14px;border:1.5px solid var(--line);background:#FFFFFF;}
  .chip.picked{border-color:var(--accent);background:#FEF6E8;}

  .nav-controls{display:flex;gap:10px;align-items:center;margin-top:4px;flex-wrap:wrap;justify-content:center;}
  .nav-controls button{background:#FFFFFF;border:1px solid #C9C2B4;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;color:#39433E;}
  .nav-controls button:hover{background:#F2EFE8;}

  @media (max-width:460px){
    .phone-shell{width:100vw;height:100vh;border-radius:0;box-shadow:none;}
    .page-wrap{padding:0;}
    .page-title,.page-sub,.nav-controls{display:none;}
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="page-title">HealthServe Connect — Web MVP Prototype (R1 LEARN)</div>
  <div class="page-sub">Click through the screens below. Works fully offline — open this file directly in any browser, no internet needed.</div>

  <div class="phone-shell">

    <!-- ===================== SCREEN 1: LANGUAGE SELECT ===================== -->
    <div class="screen active" id="screen-lang">
      <div style="background:var(--teal);padding:56px 28px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.3 8 2 4 6 4c2.4 0 4 1.4 6 4 2-2.6 3.6-4 6-4 4 0 5.7 4 4 7.7C19.5 16.4 12 21 12 21z"/></svg>
        </div>
        <h1 style="color:#FFFFFF;font-size:22px;letter-spacing:-0.2px;">HealthServe Connect</h1>
        <div id="lang-tagline" style="color:#CFE6E1;font-size:14px;text-align:center;line-height:1.4;max-width:260px;"></div>
      </div>

      <div class="scroll" style="padding:28px 24px 8px;display:flex;flex-direction:column;gap:18px;">
        <div>
          <div id="lang-choose-label" style="font-size:15px;font-weight:600;"></div>
          <div style="font-size:13px;color:var(--muted);margin-top:2px;">உங்கள் மொழியைத் தேர்ந்தெடுக்கவும் · আপনার ভাষা বেছে নিন</div>
        </div>

        <div id="lang-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;"></div>

        <div style="margin-top:4px;background:var(--teal-tint);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E5C55" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <div id="lang-audio-note" style="font-size:12.5px;color:#2B4B47;line-height:1.5;"></div>
        </div>
      </div>

      <div style="padding:16px 24px 28px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;">
        <button class="cta" id="lang-continue-btn" onclick="continueFromLanguage()" style="display:flex;align-items:center;justify-content:center;gap:8px;">
          <span id="lang-continue-label"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <div id="footer-note-1" style="text-align:center;font-size:11.5px;color:var(--muted);"></div>
      </div>
    </div>

    <!-- ===================== SCREEN 2: SIGN UP ===================== -->
    <div class="screen" id="screen-signup">
      <div class="topbar">
        <button class="backbtn" onclick="go('screen-lang')" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C2520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <h1 id="signup-title" style="font-size:17px;"></h1>
      </div>

      <div class="scroll" style="padding:16px 24px 8px;display:flex;flex-direction:column;gap:18px;">
        <div style="background:linear-gradient(135deg,#FCEFD4,#FBE4BE);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;">
          <div style="width:44px;height:44px;border-radius:12px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B9791F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a2 2 0 002 2h2a2 2 0 110 4m0-16a2 2 0 100 4m14-4v16M3 10V6a2 2 0 012-2h14a2 2 0 012 2v4M3 10h18"/></svg>
          </div>
          <div>
            <div id="signup-voucher-title" style="font-family:var(--font-head);font-weight:700;font-size:15px;color:#5A3B0A;"></div>
            <div id="signup-voucher-sub" style="font-size:12.5px;color:#7A5A24;margin-top:2px;"></div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;">
          <div>
            <div id="signup-mobile-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <input type="text" id="signup-phone-input" placeholder="+65 8xxx xxxx" style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#FFFFFF;"/>
          </div>
          <div>
            <div id="signup-fin-label" style="font-size:13px;font-weight:600;margin-bottom:6px;"></div>
            <input type="text" id="signup-fin-input" maxlength="4" placeholder="e.g. 7421" style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#FFFFFF;"/>
          </div>
        </div>

        <div style="background:var(--teal-tint);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E5C55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-4z"/></svg>
          <div id="signup-privacy-note" style="font-size:12.5px;color:#2B4B47;line-height:1.5;"></div>
        </div>
      </div>

      <div style="padding:16px 24px 28px;flex-shrink:0;">
        <button class="cta" id="signup-verify-btn" onclick="finishSignup()"></button>
      </div>
    </div>

    <!-- ===================== SCREEN 3: HOME ===================== -->
    <div class="screen" id="screen-home">
      <div class="scroll" style="padding:24px 20px 12px;display:flex;flex-direction:column;gap:18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:13px;color:var(--muted);">Thursday, 1 Oct</div>
            <h1 id="home-greeting" style="font-size:21px;margin-top:2px;"></h1>
          </div>
          <div style="width:40px;height:40px;border-radius:12px;background:#FFFFFF;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C2520" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9zM13.7 21a2 2 0 01-3.4 0"/></svg>
          </div>
        </div>

        <div style="background:var(--teal);border-radius:18px;padding:18px;">
          <div id="home-mood-title" style="color:#FFFFFF;font-weight:700;font-family:var(--font-head);font-size:15.5px;"></div>
          <div id="home-mood-sub" style="color:#CFE6E1;font-size:12.5px;margin-top:3px;"></div>

          <div style="display:flex;justify-content:space-between;gap:6px;margin-top:14px;" id="home-mood-row">
            <button class="home-mood-btn" data-mood="great" onclick="pickHomeMood(this)" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;border:1.5px solid transparent;background:rgba(255,255,255,0.14);">
              <div style="font-size:22px;">😄</div>
            </button>
            <button class="home-mood-btn" data-mood="okay" onclick="pickHomeMood(this)" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;border:1.5px solid transparent;background:rgba(255,255,255,0.14);">
              <div style="font-size:22px;">🙂</div>
            </button>
            <button class="home-mood-btn" data-mood="tired" onclick="pickHomeMood(this)" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;border:1.5px solid transparent;background:rgba(255,255,255,0.14);">
              <div style="font-size:22px;">😐</div>
            </button>
            <button class="home-mood-btn" data-mood="stressed" onclick="pickHomeMood(this)" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;border:1.5px solid transparent;background:rgba(255,255,255,0.14);">
              <div style="font-size:22px;">😣</div>
            </button>
            <button class="home-mood-btn" data-mood="struggling" onclick="pickHomeMood(this)" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;border:1.5px solid transparent;background:rgba(255,255,255,0.14);">
              <div style="font-size:22px;">😞</div>
            </button>
          </div>

          <div id="home-mood-good" style="display:none;margin-top:14px;background:rgba(255,255,255,0.92);border-radius:14px;padding:14px;text-align:center;">
            <div style="font-size:24px;">🌱</div>
            <div id="home-good-title" style="font-family:var(--font-head);font-weight:700;font-size:14px;margin-top:4px;color:#255440;"></div>
          </div>

          <div id="home-mood-escalate" style="display:none;margin-top:14px;background:rgba(255,255,255,0.96);border-radius:14px;padding:14px;flex-direction:column;gap:10px;">
            <div>
              <div id="home-escalate-title" style="font-family:var(--font-head);font-weight:700;font-size:14px;color:#7A2E1E;"></div>
              <div id="home-escalate-sub" style="font-size:12px;color:#7A2E1E;margin-top:3px;line-height:1.5;"></div>
            </div>
            <a href="tel:+6531295000" style="display:block;">
              <button style="width:100%;background:#C85A41;color:#FFFFFF;border:none;border-radius:11px;padding:12px;font-size:13.5px;font-weight:700;font-family:var(--font-head);display:flex;align-items:center;justify-content:center;gap:8px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 2 .7 3a2 2 0 01-.5 2.1L8 10a16 16 0 006 6l1.2-1.3a2 2 0 012.1-.5c1 .3 2 .5 3 .7a2 2 0 011.7 2z"/></svg>
                <span id="home-call-label"></span>
              </button>
            </a>
            <a href="https://wa.me/6591511767" target="_blank" rel="noopener" style="display:block;">
              <button style="width:100%;background:#1C2520;color:#FFFFFF;border:none;border-radius:11px;padding:12px;font-size:13.5px;font-weight:700;font-family:var(--font-head);display:flex;align-items:center;justify-content:center;gap:8px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-8.9 8.4 8.5 8.5 0 01-4-1l-4.6 1.2 1.3-4.5a8.4 8.4 0 01-1-4A8.5 8.5 0 0112.5 3a8.4 8.4 0 018.5 8.5z"/></svg>
                <span id="home-whatsapp-label"></span>
              </button>
            </a>
          </div>
        </div>

        <button onclick="openModule(continueLearningId)" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div id="continue-icon-wrap" style="width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"></div>
            <div style="flex:1;">
              <div id="continue-eyebrow" style="font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;"></div>
              <div id="continue-title" style="font-weight:700;font-family:var(--font-head);font-size:15px;margin-top:1px;"></div>
            </div>
          </div>
          <div style="margin-top:12px;height:7px;border-radius:5px;background:#EFE9DD;overflow:hidden;">
            <div id="continue-progress-bar" style="width:40%;height:100%;background:var(--accent);border-radius:5px;"></div>
          </div>
          <div id="continue-progress-label" style="font-size:11.5px;color:var(--muted);margin-top:6px;"></div>
        </button>

        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div id="wellbeing-modules-label" style="font-weight:700;font-family:var(--font-head);font-size:15.5px;"></div>
            <div id="topics-count-label" style="font-size:12.5px;color:var(--muted);"></div>
          </div>
          <div id="module-list" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>
      </div>

      <div class="bottomnav">
        <button class="navitem active" onclick="go('screen-home')">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1v-9"/></svg>
          <span class="nav-home-label"></span>
        </button>
        <button class="navitem" onclick="openModule(continueLearningId)">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"/></svg>
          <span class="nav-learn-label"></span>
        </button>
        <button class="navitem" onclick="go('screen-checkin')">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5 5 0 00-7.1 0L12 6.3l-1.7-1.7a5 5 0 10-7.1 7.1L12 20.4l8.8-8.7a5 5 0 000-7.1z"/></svg>
          <span class="nav-checkin-label"></span>
        </button>
        <button class="navitem" onclick="go('screen-profile')">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          <span class="nav-profile-label"></span>
        </button>
      </div>
    </div>

    <!-- ===================== SCREEN 4: MODULE ===================== -->
    <div class="screen" id="screen-module">
      <div class="topbar">
        <button class="backbtn" onclick="go('screen-home')" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C2520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <div style="flex:1;">
          <div id="module-eyebrow" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;"></div>
          <h1 id="module-title" style="font-size:16px;"></h1>
        </div>
      </div>

      <div id="module-dots" style="padding:14px 20px 0;display:flex;gap:6px;flex-shrink:0;"></div>
      <div id="module-step-label" style="padding:6px 20px 0;font-size:12px;color:var(--muted);flex-shrink:0;"></div>

      <div class="scroll" style="padding:18px 20px 12px;display:flex;flex-direction:column;gap:18px;">
        <div id="module-icon-box" style="background:var(--card);border:1px solid var(--line);border-radius:20px;height:180px;display:flex;align-items:center;justify-content:center;"></div>

        <div>
          <h2 id="module-headline" style="font-size:19px;line-height:1.35;"></h2>
          <p id="module-body" style="font-size:14.5px;line-height:1.65;color:#39433E;margin-top:10px;"></p>
        </div>

        <div style="background:var(--teal-tint);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;">
          <button id="playbtn" onclick="togglePlay()" style="width:42px;height:42px;border-radius:50%;background:var(--teal);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg id="playicon" width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" stroke="none"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div style="flex:1;">
            <div id="module-listen-label" style="font-size:13px;font-weight:600;"></div>
            <div style="display:flex;gap:3px;align-items:flex-end;height:16px;margin-top:6px;">
              <div style="width:3px;height:6px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:10px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:14px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:8px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:16px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:12px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:7px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:15px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:9px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
              <div style="width:3px;height:13px;background:#0E5C55;border-radius:2px;opacity:0.55;"></div>
            </div>
          </div>
          <div id="module-lang-tag" style="font-size:11.5px;color:#2B4B47;font-weight:600;"></div>

        my:{ headline:"ဒီလိုခံစားရတာ သင်တစ်ယောက်တည်း မဟုတ်ပါဘူး။", text:"အလုပ်သမား အများစုဟာ အလုပ်ချိန်ရှည်ကြာပြီးနောက် စိတ်တင်းမာမှု သို့မဟုတ် ပင်ပန်းမှုကို ခံစားရလေ့ရှိပါတယ်။ ဒါဟာ ဖိစီးမှုအပေါ် ပုံမှန်တုံ့ပြန်မှုတစ်ခုသာဖြစ်ပြီး အားနည်းချက်မဟုတ်ပါဘူး။ အလုပ်များတဲ့ နေ့မှာတောင် သေးငယ်တဲ့ လွယ်ကူတဲ့ လုပ်ဆောင်ချက်လေးတွေက ခန္ဓာကိုယ်နဲ့ စိတ်ကို တည်ငြိမ်အောင် ကူညီပေးနိုင်ပါတယ်။" }

      quiz: {

        bn:{ question:"কাজে চাপ অনুভব করলে সবচেয়ে বেশি কী সাহায্য করতে পারে?", options:["এটা উপেক্ষা করে শিফট চালিয়ে যাওয়া","একটু শ্বাস নেওয়া, পানি খাওয়া, বন্ধু বা পিয়ার লিডারের সাথে কথা বলা","কাউকে জানতে না দিয়ে দুশ্চিন্তা নিজের মধ্যে রাখা"], correct:1, wrongFeedback:"ঠিক নয় — একা বহন করা বা জোর করে চালিয়ে যাওয়া সাধারণত শরীরের জন্য আরও কঠিন করে তোলে। অন্য উত্তর চেষ্টা করুন।", correctFeedback:"ঠিক বলেছেন। এই ধরনের ছোট পদক্ষেপ সত্যিই আপনার শরীরকে শান্ত হতে সাহায্য করে।" },
        zh:{ question:"工作压力大的时候,做什么最有帮助?", options:["不理它,继续硬撑完这一班","深呼吸一下,喝点水,找朋友或同伴领袖聊聊","把烦恼都憋在心里,不让任何人知道"], correct:1, wrongFeedback:"不太对——一个人硬扛或硬撑通常只会让身体更吃不消。再试试别的答案。", correctFeedback:"答对了。像这样的小动作真的能帮助身体慢慢平静下来。" },
        th:{ question:"อะไรช่วยได้มากที่สุดเมื่อรู้สึกเครียดในที่ทำงาน?", options:["เพิกเฉยและฝืนทำงานต่อไปจนจบกะ","หายใจเข้าลึกๆ สักครู่ ดื่มน้ำ พูดคุยกับเพื่อนหรือพี่เลี้ยง (peer leader)","เก็บความกังวลไว้คนเดียวเพื่อไม่ให้ใครรู้"], correct:1, wrongFeedback:"ยังไม่ใช่คำตอบที่ถูกต้อง — การแบกรับไว้คนเดียวหรือฝืนทำต่อมักทำให้ร่างกายรับภาระหนักขึ้น ลองเลือกคำตอบอื่นดูนะ", correctFeedback:"ถูกต้องแล้ว การทำสิ่งเล็กๆ แบบนี้ช่วยให้ร่างกายสงบลงได้จริงๆ" },
        my:{ question:"အလုပ်မှာ စိတ်ဖိစီးနေတဲ့အခါ ဘာကအကူအညီအရှိဆုံးလဲ?", options:["လျစ်လျူရှုပြီး ဆက်လက်အလုပ်လုပ်ခြင်း","ခဏလေး အသက်ပြင်းပြင်းရှူခြင်း၊ ရေသောက်ခြင်း၊ သူငယ်ချင်း သို့မဟုတ် peer leader နဲ့ပြောခြင်း","ဘယ်သူမှမသိအောင် ပူပန်မှုတွေကို ကိုယ့်တစ်ယောက်တည်း ထားခြင်း"], correct:1, wrongFeedback:"မှန်ကန်မှုမရှိပါ — တစ်ယောက်တည်း ထမ်းဆောင်ခြင်း သို့မဟုတ် တွန်းအားပေး ဆက်လုပ်ခြင်းက ခန္ဓာကိုယ်အတွက် ပိုခက်ခဲစေတတ်ပါတယ်။ အခြားအဖြေကို ထပ်စမ်းကြည့်ပါ။", correctFeedback:"မှန်ပါတယ်။ ဒီလိုအဆင့်လေးတွေက ခန္ဓာကိုယ်ကို တည်ငြိမ်အောင် တကယ်ကူညီပေးပါတယ်။" }

        ta:{ headline:"நல்ல ஓய்வு உங்கள் உடலை மீட்க உதவுகிறது.", text:"ஷிப்ட் வேலை தூக்கத்தை சரியாகப் பெறுவதை கடினமாக்கும். குறுகிய ஆனால் தரமான ஓய்வு கூட, அடுத்த நாள் உங்களை நிலையாக உணர வைக்கும். முடிந்தவரை ஒரே நேரத்தில் தூங்கவும், படுக்கைக்கு முன் அறையை இருட்டாகவும் அமைதியாகவும் வைக்கவும்." },
        bn:{ headline:"ভালো বিশ্রাম আপনার শরীরকে সুস্থ হতে সাহায্য করে।", text:"শিফটের কাজ ঘুমকে ঠিকমতো পাওয়া কঠিন করে তুলতে পারে। অল্প সময়ের ভালো মানের বিশ্রামও পরদিন আপনাকে স্থির অনুভব করাতে পারে। যতটা সম্ভব নিয়মিত সময়ে ঘুমানোর চেষ্টা করুন এবং ঘুমানোর আগে ঘর অন্ধকার ও শান্ত রাখুন।" },
        zh:{ headline:"好好休息,身体才能恢复元气。", text:"轮班工作常常打乱睡眠节奏。即使睡眠时间不长,只要睡得安稳,隔天也会感觉比较有精神。尽量固定每天的睡觉时间,睡前把房间弄暗、安静下来。" },
        th:{ headline:"การพักผ่อนที่ดีช่วยให้ร่างกายฟื้นตัว", text:"การทำงานเป็นกะอาจทำให้นอนหลับได้ยาก แม้จะนอนไม่นานแต่ถ้าหลับสนิท ก็อาจทำให้รู้สึกมั่นคงขึ้นในวันถัดไป พยายามนอนให้เป็นเวลาเท่าที่ทำได้ และทำให้ห้องมืดและเงียบก่อนนอน" },
        my:{ headline:"ကောင်းမွန်တဲ့ အနားယူမှုက ခန္ဓာကိုယ်ကို ပြန်လည်နာလန်ထူစေပါတယ်။", text:"အလုပ်အလှည့်ကျ လုပ်ရတာက အိပ်စက်ဖို့ ခက်ခဲစေနိုင်ပါတယ်။ ခဏလေးပဲ အိပ်ရတောင် အရည်အသွေးကောင်းရင် နောက်နေ့မှာ ပိုတည်ငြိမ်စွာ ခံစားရနိုင်ပါတယ်။ တတ်နိုင်သလောက် ပုံမှန်အိပ်ချိန် ထားပြီး အိပ်ခါနီးမှာ အခန်းကို မှောင်မှောင်၊ တိတ်ဆိတ်အောင် ထားပါ။" }

        bn:{ question:"নাইট শিফটের পর ভালো ঘুমাতে কী সাহায্য করতে পারে?", options:["ঘুমানোর ঠিক আগে কফি বা চা খাওয়া","ঘর অন্ধকার ও ঠান্ডা রাখা এবং প্রতিদিন প্রায় একই সময়ে ঘুমানো","ক্লান্ত না লাগা পর্যন্ত বিছানায় ফোন ব্যবহার করা"], correct:1, wrongFeedback:"ঠিক নয় — এটি আসলে আপনার শরীরের ঘুমিয়ে পড়া আরও কঠিন করে তুলতে পারে। অন্য উত্তর চেষ্টা করুন।", correctFeedback:"ঠিক বলেছেন। অন্ধকার, শান্ত ঘর এবং নির্দিষ্ট ঘুমের সময় আপনার শরীরকে ঠিকমতো বিশ্রাম নিতে সাহায্য করে।" },

  var MODULE_ORDER = ['stress','sleep','homesick','money'];

  // ===================== PERSISTED STATE =====================
  // So this stays useable beyond a single click-through: module progress,
  // check-in history and the sign-up form actually persist across visits
  // (stored in localStorage, scoped to this browser).
  var STATE_KEY = 'hsc_app_state';
  function dateKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function seedDemoCheckins(){
    // Default demo history (4 consecutive prior days) so a fresh install still
    // shows a believable streak — once the visitor actually checks in, their
    // real activity takes over from here.
    var map = {};
    for (var i = 4; i >= 1; i--){
      var d = new Date(); d.setDate(d.getDate() - i);
      map[dateKey(d)] = 'okay';
    }
    return map;
  }
  function loadState(){
    var def = {
      moduleStatus: { stress:'in-progress', sleep:'not-started', homesick:'not-started', money:'done' },
      moduleStep: { stress:2, sleep:0, homesick:0, money:4 },
      checkins: seedDemoCheckins(),
      lastOpenedModule: 'stress',
      profile: { phone:'', finLast4:'7421' }
    };
    try {
      var raw = localStorage.getItem(STATE_KEY);
      if (raw){
        var saved = JSON.parse(raw);
        return {
          moduleStatus: Object.assign({}, def.moduleStatus, saved.moduleStatus),
          moduleStep: Object.assign({}, def.moduleStep, saved.moduleStep),
          checkins: Object.assign({}, saved.checkins), // real history fully replaces the seed once it exists
          lastOpenedModule: saved.lastOpenedModule || def.lastOpenedModule,
          profile: Object.assign({}, def.profile, saved.profile)
        };
      }
    } catch(e) {}
    return def;
  }
  function saveState(){
    try { localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); } catch(e) {}
  }
  var STATE = loadState();
  // Let saved progress override the demo defaults baked into MODULES.
  MODULE_ORDER.forEach(function(id){
    MODULES[id].status = STATE.moduleStatus[id];
    MODULES[id].currentStep = STATE.moduleStep[id];
  });
  continueLearningId = STATE.lastOpenedModule;

  function computeStreak(){
    var dates = Object.keys(STATE.checkins).sort();
    if (!dates.length) return 0;
    var streak = 1;
    for (var i = dates.length - 1; i > 0; i--){
      var diffDays = Math.round((new Date(dates[i]) - new Date(dates[i-1])) / 86400000);
      if (diffDays === 1) streak++; else break;
    }
    return streak;
  }
  function recordCheckin(mood){
    STATE.checkins[dateKey(new Date())] = mood;
    saveState();
    setText('profile-streak-value', computeStreak());
    setText('profile-checkins-value', Object.keys(STATE.checkins).length);
  }

  // Word order for "X minutes left" isn't universal — Mandarin fronts the
  // "remaining" word ("还剩3分钟"), unlike English/Tamil/Bengali/Thai/Burmese
  // which naturally append it after the number. Handle that instead of
  // forcing every language through the same suffix template.
  function formatMinLeft(n){
    if (pickedLang === 'zh') return '还剩 ' + n + ' 分钟';
    return n + ' ' + t('minLeft');
  }

  // ===================== MODULE SCREEN =====================
  var currentModuleId = 'stress';
  function openModule(id){
    currentModuleId = id;
    resetQuizState();
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    playing = false;
    setPlayIcon(false);

    // Opening a module is itself progress — persist it so "Continue learning"
    // on Home reflects what the visitor actually did last, across visits.
    if (MODULES[id].status === 'not-started'){
      MODULES[id].status = 'in-progress';
      MODULES[id].currentStep = 1;
    }
    STATE.moduleStatus[id] = MODULES[id].status;
    STATE.moduleStep[id] = MODULES[id].currentStep;
    if (MODULES[id].status !== 'done'){
      continueLearningId = id;
      STATE.lastOpenedModule = id;
    }
    saveState();

    renderModuleScreen();
    renderQuiz();
    go('screen-module');
  }

  function renderModuleScreen(){
    var m = MODULES[currentModuleId];
    document.getElementById('module-eyebrow').textContent = t('wellbeingModuleLabel');
    document.getElementById('module-title').textContent = moduleTitle(currentModuleId, pickedLang);

    var filled = m.status === 'done' ? m.steps : m.currentStep;

      dot.style.cssText = 'flex:1;height:6px;border-radius:4px;background:' + (i < filled ? '#0E5C55' : '#E7E1D6') + ';';

  // Audio player toggle (visual only)
  var playing = false;
  var SPEECH_LANG = { en:'en-US', ta:'ta-IN', bn:'bn-IN', zh:'zh-CN', th:'th-TH', my:'my-MM' };
  function setPlayIcon(isPlaying){
    var icon = document.getElementById('playicon');
    if (!icon) return;
    icon.innerHTML = isPlaying
      ? '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>'
      : '<path d="M8 5v14l11-7z"></path>';
  }
  function togglePlay(){
    if (!('speechSynthesis' in window)){
      // No speech support on this device/browser — nothing to toggle to.
      return;
    }
    if (playing){
      window.speechSynthesis.cancel();
      playing = false;
      setPlayIcon(false);
      return;
    }
    var content = moduleBody(currentModuleId, pickedLang);
    var text = content.headline + '. ' + content.text;
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = SPEECH_LANG[pickedLang] || 'en-US';
    utter.rate = 0.95;
    utter.onend = function(){ playing = false; setPlayIcon(false); };
    utter.onerror = function(){ playing = false; setPlayIcon(false); };
    window.speechSynthesis.cancel(); // stop anything already speaking first
    window.speechSynthesis.speak(utter);
    playing = true;
    setPlayIcon(true);
  }

  function renderQuiz(){

      btn.innerHTML = '<div style="display:flex;align-items:center;gap:12px;">' +
        '<div class="ring" style="width:22px;height:22px;border-radius:50%;border:2px solid #CBD3CE;flex-shrink:0;"></div>' +
        '<div style="font-size:14.5px;font-weight:500;flex:1;">'+optText+'</div>' +

  function pickQuiz(el, correct){
    if (quizSolved) return; // lock in the right answer once found, so the state stays unambiguous

    document.querySelectorAll('#quiz-options .chip').forEach(function(c){
      c.classList.remove('picked');
      c.style.borderColor = '#E7E1D6';
      c.style.background = '#FFFFFF';
      var ring = c.querySelector('.ring');
      ring.style.border = '2px solid #CBD3CE';
      ring.style.background = 'transparent';
      ring.innerHTML = '';
    });

    el.classList.add('picked');
    var ring = el.querySelector('.ring');
    ring.style.display = 'flex';
    ring.style.alignItems = 'center';
    ring.style.justifyContent = 'center';

    var feedback = document.getElementById('quiz-feedback');
    var icon = document.getElementById('quiz-feedback-icon');
    var text = document.getElementById('quiz-feedback-text');
    var finishBtn = document.getElementById('quiz-finish');
    feedback.style.display = 'flex';

    var q = moduleQuiz(currentModuleId, pickedLang);

    if (correct) {
      quizSolved = true;
      el.style.borderColor = '#3F8F6B';
      el.style.background = '#F3FBF6';
      ring.style.border = '2px solid #3F8F6B';
      ring.style.background = '#3F8F6B';
      ring.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

      feedback.style.background = 'var(--good-tint)';
      icon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F8F6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>';
      text.style.color = '#255440';
      text.textContent = q.correctFeedback;

      finishBtn.disabled = false;
      finishBtn.textContent = t('finishModule');

      // Persist completion — Profile's "Modules done" count and Home's status
      // badges now reflect real progress, not a fixed demo number.
      MODULES[currentModuleId].status = 'done';
      MODULES[currentModuleId].currentStep = MODULES[currentModuleId].steps;
      STATE.moduleStatus[currentModuleId] = 'done';
      STATE.moduleStep[currentModuleId] = MODULES[currentModuleId].steps;
      saveState();
    } else {
      el.style.borderColor = '#C85A41';
      el.style.background = '#FBEAE6';
      ring.style.border = '2px solid #C85A41';
      ring.style.background = '#C85A41';
      ring.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

      feedback.style.background = 'var(--alert-tint)';
      icon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C85A41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
      text.style.color = '#7A2E1E';
      text.textContent = q.wrongFeedback;

      finishBtn.disabled = true;
      finishBtn.textContent = t('chooseAnswer');
    }
  }

  // ===================== CHECK-IN =====================
  function pickMood(el){
    document.querySelectorAll('.mood-btn').forEach(function(b){
      b.style.border = '1.5px solid var(--line)';
      b.style.background = '#FFFFFF';
    });
    el.style.border = '1.5px solid var(--teal)';
    el.style.background = 'var(--teal-tint)';

    var mood = el.getAttribute('data-mood');
    var good = document.getElementById('mood-good');
    var escalate = document.getElementById('mood-escalate');
    if (mood === 'great' || mood === 'okay'){
      good.style.display = 'block';
      escalate.style.display = 'none';
    } else {
      good.style.display = 'none';
      escalate.style.display = 'flex';
    }
    recordCheckin(mood);
  }

  // Home dashboard inline check-in — one tap, no page change
  function pickHomeMood(el){
    document.querySelectorAll('.home-mood-btn').forEach(function(b){
      b.style.background = 'rgba(255,255,255,0.14)';
      b.style.borderColor = 'transparent';
    });
    el.style.background = 'rgba(255,255,255,0.32)';
    el.style.borderColor = 'rgba(255,255,255,0.6)';

    var mood = el.getAttribute('data-mood');
    var good = document.getElementById('home-mood-good');
    var escalate = document.getElementById('home-mood-escalate');
    if (mood === 'great' || mood === 'okay'){
      good.style.display = 'block';
      escalate.style.display = 'none';
    } else {
      good.style.display = 'none';
      escalate.style.display = 'flex';
    }
    recordCheckin(mood);
  }

  // ===================== INITIALISE =====================
  renderLangs();
  applyLanguage();

  // Every visitor starts at language selection, then sign-up — there is no
  // real login yet, so there is no verified identity to safely skip ahead
  // for. Once a real login exists, this is where it should route a
  // recognised user back to their last screen instead.
  go('screen-lang');
</script>

</body>
</html>
